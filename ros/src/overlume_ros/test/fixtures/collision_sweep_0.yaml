# Hand-written synthetic fixture (VM-026, fixture gap 4: the five
# collision-checker topics were silent in the recorded bag, so every
# collision fixture is synthetic, unvalidated against a live publisher).
# One /ego_footprint_sweep MarkerArray message: a LINE_STRIP polygon
# tracing the ego's swept footprint, deliberately not closed --
# CollisionAdapter.OpenPolylineIsClosedIntoAPolygon asserts the adapter
# closes it anyway.
markers:
- header:
    frame_id: map
  ns: sweep
  id: 1
  type: 4
  action: 0
  points:
  - {x: -2.0, y: -1.0, z: 0.0}
  - {x: 2.0, y: -1.0, z: 0.0}
  - {x: 2.0, y: 1.0, z: 0.0}
  - {x: -2.0, y: 1.0, z: 0.0}

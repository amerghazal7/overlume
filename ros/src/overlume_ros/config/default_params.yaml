/**:
  ros__parameters:
    out_width: 1280
    out_height: 720
    quality: 1
    # VM-040 (Epic 5): quality auto-drop with hysteresis. Opt-in (a new
    # auto-behavior ships default off); the governor otherwise never touches
    # `quality` above. Thresholds/windows are their own tunable params --
    # see quality_governor.hpp for the reasoning behind these defaults.
    governor_enabled: false
    governor_window_size: 30
    governor_drop_threshold_ms: 28.0
    governor_recover_threshold_ms: 18.0
    governor_recover_windows_required: 3
    governor_min_dwell_windows: 3
    # 1 = rendering_node bowl, 2 = hybrid, 3 = this node (visual). Both nodes
    # must agree at startup (spec §3.1) so exactly one publisher is active
    # on /rendering/image from the first frame.
    initial_mode: 1
    # Static hello-frame camera pose [eye xyz | target xyz]; see overlume_node.cpp.
    virtual_pose:
    - -4.0
    - 0.0
    - 3.5
    - 2.0
    - 0.0
    - -0.5
    virtual_vfov_deg: 80.0
    # Theme assets (VM-044): "" resolves via ament_index to this package's
    # own installed share/assets/themes (overlume_node.cpp's
    # on_configure) instead of DEFAULT_THEME_ASSETS_DIR's compiled-in
    # absolute path to THIS checkout's source tree. Set an absolute path to
    # point at a hand-edited theme dir instead.
    theme_assets_dir: ""
    # Which shipped theme (yaml stem) loads at startup. Validated against
    # theme_assets_dir's actual contents -- configure FAILS on an unknown name.
    initial_theme: dark_adas
    # Ego robot mesh (VM-012); mirrors micropilot_rendering_node's
    # robot_model_path convention. "" is not "disabled": overlume::set_ego_model
    # always renders something (a themed clay box at ego_fallback_dims on
    # load failure) -- "" resolves via ament_index to this package's own
    # installed share/assets/ego/M02P.glb (VM-044) if
    # scripts/provision_ego_model.sh has provisioned one, else stays "" and
    # the clay-box fallback is honest about the gap. Set an absolute path to
    # override with a different mesh.
    ego_model_path: ""
    ego_fallback_dims: [4.5, 2.0, 1.8]
    ego_speed_smoothing_alpha: 0.2
    # flatten_z: the HD-map layer is a 2D plane, so real z (live TF altitude,
    # dynamic-object bbox centers) would render as floating geometry above
    # it -- every adapter zeroes z while this is true (frame_transform.hpp,
    # tf_adapter.hpp). Set false once the HD-map layer has real 3D coords.
    flatten_z: true
    # HUD compositor font (VM-030/VM-044): "" resolves via ament_index to
    # this package's own installed share/assets/fonts (overlume_node.cpp's
    # on_configure) instead of a per-checkout absolute path. Missing/
    # unloadable is non-fatal (CompositeHud() WARNs once, HUD just isn't
    # drawn that tick). Set an absolute path to point at a different font.
    hud_font_path: ""
    # HUD disable knob (STANDING directive, visual-mode-epic3.md): false
    # skips CompositeHud() entirely, frame passes through untouched.
    hud_enabled: true
    # Alert-callout disable knob (VM-031, STANDING directive): false skips
    # BuildNearestCallout() entirely, frame passes through untouched. Style
    # (leader line + chip color) reuses the same theme hud.accent_color the
    # HUD's own mode chip already draws with -- no new theme token.
    callouts_enabled: true
    # Per-category layer visibility (VM-032, STANDING directive disable-knob
    # story): unlike hud_enabled/callouts_enabled above, these are read LIVE
    # every tick -- a set_layers WS command (or a plain `ros2 param set`)
    # takes effect on the very next tick, no restart. layer_point_clouds is
    # declared here but stays inert until Task 6 (VM-035) adds the
    # PointCloud category it would gate.
    layer_objects: true
    layer_paths: true
    layer_map_elements: true
    layer_grids: true
    layer_alerts: true
    layer_markers: true
    layer_point_clouds: true
    # VM-077: gates the output_trajectory_carpet category. Singular knob
    # name, matching the category's own singular topic/adapter/role.
    layer_trajectory_carpet: true
    # Task 4 (VM-093): local render-mode switch, 1=BOWL/2=HYBRID/3=FREE_LOOK
    # (default). Declare-time out-of-range WARNs and defaults to 3; a LIVE
    # `ros2 param set`/set_parameters() out-of-range value is REJECTED
    # instead -- see overlume_node.hpp's render_mode_ field comment for
    # the full contract (mode content exclusivity, mux interaction).
    render_mode: 3
    # Surround Stitching (Task 4/VM-093 follow-up directive): mode-3-only
    # bowl-in-same-frame toggle, off by default -- see overlume_node.hpp's
    # layer_surround_stitching_ field comment.
    layer_surround_stitching: false
    surround_stitching_profile: bowl
    # Which shipped profile to load (urban|offroad|sim -> <profile>_profile.yaml).
    # profile_dir: "" means this package's own installed share/config
    # (resolved via ament_index_cpp in overlume_node.cpp); set an
    # absolute path to point at a hand-edited profile instead (VM-042).
    profile: urban
    profile_dir: ""
    # VM-050 (Epic 4 Task 1): manual geo-anchor override, for GPS-denied
    # replays -- NaN (all three) means "no override, sample NavSatFix+TF
    # instead" (the spec's PRIMARY path). All-or-nothing: setting only one
    # or two of these three is a config ERROR (overlume_node.cpp logs
    # it once at startup and does not apply a partial/blended anchor).
    geo_datum_lat_deg: .nan
    geo_datum_lon_deg: .nan
    geo_datum_heading_deg: .nan
    # VM-052 (Epic 4 Task 3): baked-environment (clay buildings) disable knob
    # (STANDING directive) -- false means on_activate() never calls
    # overlume::set_environment_source() at all, same "config for every
    # rendered element" shape as hud_enabled/callouts_enabled above.
    environment_enabled: true
    # Path to Task 2 (VM-051)'s baked chunk index dir (index.yaml +
    # chunks/*.glb) -- same CLASS of gap theme_assets_dir/ego_model_path used
    # to be, but VM-044's backlog text scopes that task to themes + the ego
    # mesh only, so this one stays a per-run manual path, not ament-resolved.
    # "" is non-fatal: on_activate() WARNs once and never calls
    # set_environment_source() (no anchor solved / no dir given -- same
    # "missing data renders nothing" convention, spec §9).
    environment_chunks_dir: ""
    # VM-063 (Epic 6 Task 4): source-selection config. "" (the shipped
    # default) means keep using environment_chunks_dir_ above as a baked
    # dir -- byte-for-byte today's behavior, every existing deployment
    # unaffected. A non-empty value switches to the streamed backend.
    # environment_chunks_dir above, if also set, becomes the automatic
    # fallback dir on network loss (Decision 11) -- zero extra config
    # needed for a streamed deployment that already has its own Epic-4
    # bake. Known ceiling: a path containing '?' or '&' is unsupported by
    # the library's split-only query parser (Decision 5).
    #
    # THREE documented presets (Decision 14, VM-064/Epic 6 Task 5) -- see
    # docs/runbooks/cesium.md for the ion account/token setup in every
    # case (by name, NEVER the token value itself; the library reads
    # CESIUM_ION_TOKEN from the environment). Uncomment exactly one to pick
    # a source; the shipped default below (plain "") keeps today's baked
    # behavior.
    #   ion://96188
    #     Cesium OSM Buildings (curated, global coverage incl. this repo's
    #     Dubai/Sharjah operating area) -- clay re-materialized, needs no
    #     upload. The shipped default asset id (cesium.md Path A).
    #   ion://<own-asset-id>
    #     A clipped/uploaded tileset (cesium.md Path B) -- smaller,
    #     cache-friendlier clay tiles at the cost of a per-deployment
    #     upload step. Replace <own-asset-id> with the numeric id ion
    #     assigned your upload.
    #   ion://2275207?materials=original&cache=off
    #     Google Photorealistic 3D Tiles (VM-064) -- textured photoreal
    #     mesh, NOT clay: materials=original keeps gltfio's own loaded
    #     materials instead of the buildingMaterial remap. Asset id 2275207
    #     VERIFIED at VM-064 implementation against the live ion Asset
    #     Depot API (name/type match, 2026-09-16) -- never guessed, per
    #     VM-064's own factual rule. cache=off ships until this
    #     deployment has re-verified Google's Map Tiles cache-lifetime
    #     terms (cesium.md's Google section, Step 2(b)); attribution is
    #     drawn automatically once uncommented (environment_attribution
    #     below, on by default). Expected to be heavier than either clay
    #     preset (textured photoreal mesh); the one dev-box single-tile live
    #     measurement was INCONCLUSIVE and did not confirm it -- read this
    #     epic's results block before budgeting for it (cesium.md).
    environment_source_uri: ""
    # VM-096 (vcam GUI Environment Tiles toggle): the deployment's OWN
    # ion asset id for the "clipped" preset above (cesium.md Path B) --
    # "" (the shipped default, every checkout) means this deployment has
    # not uploaded/clipped its own tileset yet. NEVER a fabricated id: the
    # vcam GUI/WS bridge grey out the "clipped" option whenever this is
    # empty rather than guess one. Set it to "ion://<own-asset-id>" (the
    # SAME string this file's own comment above documents for
    # environment_source_uri) once this deployment has one.
    environment_own_asset_uri: ""
    # VM-063: on-disk tile cache dir for the streamed backend (ignored by
    # the baked backend; an inline cache= already present in
    # environment_source_uri, as the google preset above ships with
    # cache=off, also takes precedence over this dir -- on_activate()
    # only appends "cache=<this dir>" when the URI has no cache= key).
    # "" (the shipped default) uses the library's own default
    # (${XDG_CACHE_HOME:-$HOME/.cache}/overlume-tile-cache, Decision 10) --
    # set this only to override that location (e.g. a different
    # disk/quota on a specific robot). Same '?'/'&' path ceiling as above.
    environment_tile_cache_dir: ""
    # VM-064 (Epic 6 Task 5): Google Photorealistic 3D Tiles attribution
    # disable knob (STANDING directive) -- on by default, but only actually
    # draws a line while environment_source_uri above is running in
    # materials=original mode (Decision 14); a plain OSM-clay/clipped-clay
    # preset draws nothing here even with this left true. See
    # docs/runbooks/cesium.md's Google section for the attribution
    # requirement and the exact wording to verify before go-live.
    environment_attribution: true
    # VM-091 (unified-engine migration Task 2): mode-1 bowl camera ingest.
    # The disable knob per the STANDING rule (declare-default off; false
    # means no camera subs, no cv_bridge cost, no set_bowl_config/
    # set_camera_frame/set_camera_motion_delta calls) -- but THIS shipped
    # config sets it true since the VM-095 cutover (Step 6): modes 1/2 are
    # live by default in the one surviving node.
    # n_cameras/image_topics/info_topics/camera_extrinsics and
    # bowl_R0/k/Rmax/feather_margin/sky_color below are ported verbatim from
    # the retired CUDA node's default_params.yaml (the CARLA-sim config --
    # same six camera topics the fixture bag publishes), not reinvented.
    bowl_enabled: true
    n_cameras: 6
    image_topics:
    - /fl_camera/raw_images
    - /fm_camera/raw_images
    - /fr_camera/raw_images
    - /bl_camera/raw_images
    - /bm_camera/raw_images
    - /br_camera/raw_images
    info_topics:
    - /fl_camera/camera_info
    - /fm_camera/camera_info
    - /fr_camera/camera_info
    - /bl_camera/camera_info
    - /bm_camera/camera_info
    - /br_camera/camera_info
    # GUI-tunable; in this merged node it is the ego-motion re-alignment/
    # staleness window (Step 6's redefined frame-sync gate semantics), no
    # longer a render-withholding threshold the way the old node used it.
    max_sync_latency: 0.12
    # "" disables ego-motion compensation (identity deltas every tick) --
    # this epic's own fixture bag carries no odometry topic at all, so this
    # stays the honest default; a real robot config sets it (m2o1_params.yaml
    # uses /fixposition/odometry_enu).
    odom_topic: ""
    # Read back by the GUI bridge's config-save path (mirrors
    # micropilot_rendering_node's own config_path param, rendering_node.cpp).
    config_path: ""
    bowl_R0: 17.0
    bowl_k: 0.06
    bowl_Rmax: 40.0
    feather_margin: 480.0
    # Declared false AND node-clamped to false with a WARN (Decision 3's
    # exposure/blind-zone deferral -- see the layer_param_cb_ extension in
    # overlume_node.cpp): neither has a Filament-side implementation in
    # this epic, so a config source that carries `true` (m2o1_params.yaml
    # does, for both) must not silently re-enable a capability that isn't
    # actually there. The yaml default here is honesty, not the enforcement.
    fill_blind_zone: false
    exposure_match: false
    sky_color:
    - 0.53
    - 0.7
    - 0.92
    # Style knob alongside sky_color/feather_margin (bowl.mat's
    # exposureCompensation parameter). Default 1.56, MEASURED by
    # tools/bowl_exposure_probe.cpp, not guessed -- full derivation and
    # history at scene.h's BowlConfig::exposure_compensation. This param
    # remains the live fine-tune knob over that measured default.
    bowl_exposure_compensation: 1.56
    camera_extrinsics:
    - 0.9961946980917455
    - -0.06269459458646724
    - 0.06054346623323177
    - -0.08715574274765814
    - -0.7166024952237391
    - 0.6920149856363047

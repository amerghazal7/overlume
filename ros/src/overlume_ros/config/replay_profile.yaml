# Replay profile for real-robot logger sessions played by mp_play, which
# re-publishes recorded topics with the recorder's BEST_EFFORT QoS: the four
# marker rows below add best_effort: true (a reliable subscription never
# connects to a best-effort publisher). Otherwise identical to urban_profile.yaml.

# DEVIATION from the epic2 plan's literal YAML text (Task 1 Step 3): every
# `namespaces:` list here is written as a flow SEQUENCE (`[{...}, {...}]`)
# rather than a block sequence of flow maps nested inside an outer flow
# mapping. The plan doc's literal form (`namespaces:\n  - {...}\n  - {...}`
# closed by the row's own trailing `}}`) is not legal YAML once the row
# itself opens with `- {topic: ...` -- a block-sequence `-` cannot appear
# inside an already-open flow mapping. Verified against BOTH parsers this
# profile is read by: PyYAML (`yaml.safe_load`) and the node's own
# yaml-cpp (`YAML::LoadFile`) reject the literal form with "illegal block
# entry" / "expected the node content, but found '-'". The flow-sequence
# form parses identically under both and preserves every row exactly as
# written in the plan. Same fix applied in offroad_profile.yaml and
# sim_profile.yaml.
name: replay
rows:
  # Five namespaces on the wire (full-bag deserialization of all 1921 msgs):
  # dynamic_objects_bbox 15559, _text 15559, _arrow 15522, _hd_map_path 5894,
  # _hd_map_path_dots 5894. The first four fuse into one TrackedObject
  # (Task 3). The fifth is the SAME predicted path drawn again as dots (also
  # LINE_LIST, same 5894 count, same objects) -- ingesting it would draw every
  # predicted ribbon TWICE. It is dropped by rule, not by silence, so it lands
  # in dropped_by_rule and VM-034 reports it. Longest-prefix-wins is what makes
  # this expressible: "dynamic_objects_hd_map_path" is a PREFIX of
  # "dynamic_objects_hd_map_path_dots".
  - {topic: /perception/dynamic_objects_list, type: visualization_msgs/msg/MarkerArray,
     adapter: dynamic_objects, role: tracked, timeout_sec: 2.0,
     ns_default: drop,
     namespaces: [
       {prefix: dynamic_objects_bbox,              render: polyline},
       {prefix: dynamic_objects_text,               render: polyline},
       {prefix: dynamic_objects_arrow,              render: polyline},
       {prefix: dynamic_objects_hd_map_path,        render: polyline},
       {prefix: dynamic_objects_hd_map_path_dots,   render: drop}]}


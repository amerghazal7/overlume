  # check -- flip transient_local: true here IF the publisher is latched; if
  # it is genuinely VOLATILE, the node must be up before the publisher.
  # Junction cleanup: same as the local row above -- no `junction` rule, so
  # only the mutual-crossing cut (plus its gap-merge/arc-snap/redundant-tail
  # refinements) applies; `junction_interior_boundaries` (default true, not
  # written) is likewise inert here. See the local row's own comment.
  - {topic: /hd_map_global_elements, type: visualization_msgs/msg/MarkerArray,
     adapter: hd_map, role: lane, timeout_sec: 5.0, max_rate_hz: 0.5,
     ns_default: drop,
     namespaces: [
       {prefix: centerline_,         render: drop},
       {prefix: centerline_arrows_,  render: drop},
       {prefix: left_boundary_,      render: polyline, kind: left_boundary},
       {prefix: right_boundary_,     render: polyline, kind: right_boundary},
       {prefix: crosswalk,           render: polygon,  kind: crosswalk},
       {prefix: crosswalk_stopline_, render: polyline, kind: stopline}]}


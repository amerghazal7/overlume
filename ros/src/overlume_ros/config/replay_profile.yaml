  # the same bag index):
  #   marker_1 (base_link frame, ARROW+CUBE): 31/31 exact distance-signature
  #     match against marker_2 -- same objects, pre-transform.
  #   marker_2 (map frame, ARROW+CUBE): 24/31 direct position matches
  #     against this row's own topic (same idx, rounding + small Δt).
  #   marker_3 (map frame, ARROW+CUBE): 32/32 exact distance-signature match
  #     against this row's own topic -- full duplicate.
  #   marker_4 (0 CUBEs, 243-518 ARROW/CYLINDER/LINE_STRIP markers/msg):
  #     shape matches this topic's own dynamic_objects_hd_map_path{,_dots}
  #     namespaces -- near-certainly a duplicate path encoding (not
  #     point-for-point confirmed, time-budgeted).
  #   marker_5, marker_6: 0 messages in either recorded bag.
  # Recommend NOT adding rows for any of these -- this row (real track ids,
  # TEXT labels, HD-map path lines) is the richer superset besides.

  # PRIMARY map source: rolling ~50 m local window, ~18 Hz, always joinable.
  # Namespace rules: LONGEST MATCHING PREFIX WINS, unmatched -> ns_default.
  # centerline_arrows_ is dropped: 93% of all map markers in the recorded bag
  # (3.31M of 3.56M) for a cosmetic per-lane direction hint. Re-enable by
  # changing its render: to polyline; no rebuild needed. Note it needs its own
  # rule -- "centerline_" is a PREFIX of "centerline_arrows_0", so listing
  # only centerline_ would admit every arrow marker.
  # centerline_ itself is ALSO dropped: hidden by default -- these are the
  # logical lane-center lines the HD map records, not painted road markings,
  # and the road already reads correctly without
  # them (solid yellow ROAD_EDGE outer lines, dashed white interior
  # boundaries, filled road surface). Re-enable by restoring
  # `render: polyline, kind: centerline` on this rule (`kind` cannot be set
  # while `render: drop` -- ValidateRow's KindIsLegalOnRender rejects a
  # non-OTHER kind on a drop verdict); once re-enabled, centerlines render as
  # faint dot guidance (map_elements.cpp's build_centerline_dots()), not the
  # old solid strip -- and `palette.lane_centerline` (both shipped themes)
  # picks the dot color.
  # crosswalk_ is the only polygon namespace: on the wire it is a LINE_STRIP
  # exactly like the centerlines, so is_polygon (and therefore the crosswalk
  # hatching in spec §7) can only come from here.
  # crosswalk_stopline_ is a real map element and is KEPT, as a polyline -- it
  # is a painted stop bar, not a crosswalk box; again it needs its own rule
  # because crosswalk_ is a prefix of it.
  #
  # Junction cleanup: this row has no `junction` namespace rule -- this feed
  # never carries JUNCTION geometry -- so the cut mechanism that applies
  # here is the mutual-crossing cut (hd_map.cpp): any two ROAD_EDGE
  # polylines from different lane_ids that cross in 2D at a real angle get
  # trimmed back from the crossing point. SegSegIntersect2D rejects
  # near-parallel AND near-antiparallel segment pairs (not just
  # exactly-parallel ones; see its own comment), so a chained lanelet
  # boundary's ordinary survey kink at a shared node is never mistaken for a
  # crossing. `junction_interior_boundaries` (row key, default true, not
  # written here) keeps interior LEFT_/RIGHT_BOUNDARY dashed separators
  # visible through a junction box by default -- set it to false to drop
  # them there too, though it is INERT on this row specifically: with no
  # JUNCTION polygon to clip against, there is nothing for it to do (see
  # ProfileRow's own comment).
  #
  # Three refinements on top of the base cut (all in hd_map.cpp -- see that
  # file's own comments for the measured thresholds and plan
  # 2026-08-18-visual-mode-epic3.md for the full derivations):
  #   - gap-merge: neighbouring crossing windows merge when under
  #     kJunctionGapMergeM=6.6 m apart, instead of leaving the small gap as
  #     its own tiny rendered leftover.
  #   - arc-snap (SnapWindowsToArcs): each cut-window boundary snaps outward
  #     to a real corner arc's own far edge when one is found nearby on the
  #     same edge's own polyline, instead of stopping at an arbitrary fixed
  #     distance mid-curve.
  #   - redundant-tail trim (TrimRedundantArcTails): an arc-bearing edge's
  #     own tail past its rejoin vertex is trimmed back when it duplicates a
  #     different, independently-promoted ROAD_EDGE piece for the rest of
  #     its length.
  - {topic: /hd_map_local_elements, best_effort: true, type: visualization_msgs/msg/MarkerArray,
     adapter: hd_map, role: lane, timeout_sec: 5.0, max_rate_hz: 2.0,
     ns_default: drop,
     namespaces: [
       {prefix: centerline_,         render: drop},
       {prefix: centerline_arrows_,  render: drop},
       {prefix: left_boundary_,      render: polyline, kind: left_boundary},
       {prefix: right_boundary_,     render: polyline, kind: right_boundary},
       {prefix: crosswalk,           render: polygon,  kind: crosswalk},
       {prefix: crosswalk_stopline_, render: polyline, kind: stopline}]}

  # FIXTURE GAP: /hd_map_global_elements was silent in the recorded bag

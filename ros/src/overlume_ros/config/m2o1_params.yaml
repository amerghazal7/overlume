# Generated 2026-07 by the retired autotune_config.py (CUDA-node era, removed 2026-09-17); edit by hand when cameras/mounting change.
# source: calib: a sensors_extrinsic_calib.yaml from the deployed robot (2026-07-09), not in this repo
# camera_extrinsics hand-updated 2026-07-09 from the new deployment calib.
# Calib ego origin sits +1.15 up of the robot origin (no fwd offset), so
# t = calib t + [0, 0, 1.15]. Supersedes the 07-08 bl/br refits.
#
# Migrated from micropilot_rendering_node/config/m2o1_params.yaml at the
# unified-engine migration's Task 6 (VM-095) Step 2b — the old node's schema
# cannot launch the merged node as written, so this is a translation, not a
# plain move:
#   - virtual_pose: the old 12-float [R(9 row-major)|t(3)] -> the merged
#     node's 6-float [eye xyz|target xyz] (overlume::CameraPose). eye = t;
#     target = eye + fwd, fwd = R's third column (R[2],R[5],R[8]), d=1.0 —
#     the same conversion sanity-checked against rendering_node.cpp's own
#     compiled-in default pose, which converts to exactly the
#     eye=(0,-4,0)/target=(0,-5,0) pair test_vcam_contract.py already
#     documents. Here: eye=(-3.0,0.0,3.0),
#     target=(-2.1566085541871143,0.0,2.4627003916531761).
#   - robot_model_path/robot_model_transform -> ego_model_path: left "" —
#     this robot's M02P glTF is provisioned per-box by
#     overlume_ros/scripts/provision_ego_model.sh (VM-044),
#     not carried forward as the old per-user ~/Downloads path; a box that
#     hasn't run that script gets the clay-box fallback (ego.cpp), an
#     accepted, named parity exception (signoff.md #3), not silently fixed
#     here.
#   - fill_blind_zone/exposure_match: forced false (both were true) —
#     neither has a Filament-side implementation (Decision 3); the node's
#     own clamp would coerce them to false anyway, this keeps the file
#     honest instead of relying on the runtime WARN.
#   - out_width/out_height/virtual_vfov_deg: kept as deployed (unchanged
#     names/types, override the merged node's 1280x720/80 deg defaults).
#   - n_cameras/image_topics/info_topics/camera_extrinsics/bowl_R0/bowl_k/
#     bowl_Rmax/feather_margin/sky_color/max_sync_latency/odom_topic/
#     pointcloud_topic/pointcloud_transform/splat_radius: unchanged — these
#     were already ported verbatim to the merged node's own param schema
#     (Tasks 1/2/5).
/**:
  ros__parameters:
    n_cameras: 6
    out_width: 1280
    out_height: 720
    max_sync_latency: 0.12
    odom_topic: /fixposition/odometry_enu
    bowl_R0: 6.0
    bowl_k: 0.2
    bowl_Rmax: 22.0
    feather_margin: 480.0
    fill_blind_zone: false
    exposure_match: false
    ego_model_path: ""
    # Fused lidar cloud (frame: seyond = calib ego origin). Lifted by the same
    # +1.15 z offset as camera_extrinsics t (no fwd offset).

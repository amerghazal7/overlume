# fog_color_black_dark.yaml — test fixture for test_theme.cpp's Fog.
# ColorAffectsRenderedOutput (dark_adas branch). FROZEN at assets/themes/
# dark_adas.yaml's HISTORICAL values (Finding #5/#27) except `palette.fog`
# -- isolates whether FogOptions::color reaches the screen at this
# operating point. NOT kept in sync with dark_adas.yaml, which has since
# moved on (current shipped ground/sky/lane_paint/sun/ibl/fog.density
# differ from what's authored below) -- this fixture deliberately stays put
# rather than re-tuning to chase the live theme. Fixed code moves the mean
# by ~166 between black/white fog here, well past the >15.0 liveness bar.
name: fog_color_black_dark
palette:
  ground:      [0.05, 0.06, 0.08]
  sky:         [0.02, 0.02, 0.05]
  fog:         [0.0, 0.0, 0.0]
  lane_paint:  [0.45, 0.5, 0.55]
  ribbon_core: [0.10, 1.00, 0.40]
  ribbon_glow: [0.10, 1.00, 0.40]
  object_tints:
    car: [0.25, 0.35, 0.9]
    truck_van: [0.30, 0.35, 0.85]
    bus: [0.85, 0.6, 0.15]
    pedestrian: [0.9, 0.2, 0.2]
    cyclist: [0.9, 0.55, 0.1]
    unknown: [0.5, 0.5, 0.5]
  alert:
    info: [0.2, 0.6, 1.0]
    warning: [1.0, 0.7, 0.1]
    critical: [1.0, 0.15, 0.1]
material: { roughness: 0.85, metallic: 0.0 }
emissive: { ribbon_strength: 4.0 }
grid: { line_color: [0.12, 0.14, 0.18], fade_start_m: 15.0, fade_end_m: 40.0 }
hud: { text_color: [0.9, 0.95, 1.0], accent_color: [0.10, 1.0, 0.4], scale: 1.0 }
sun: { direction: [-0.5, -0.3, -1.0], color: [0.55, 0.6, 0.75], intensity: 480000.0 }
ibl:  # analytic 2-band hemisphere gradient — NOT raw SH coefficients
  sky_color:    [0.05, 0.06, 0.12]
  ground_color: [0.02, 0.02, 0.03]
  intensity: 256000.0
# Frozen at this historical fog.density (Finding #5/#27) -- dark_adas.yaml's
# own shipped value has since moved on; deliberately not re-synced.
fog: { density: 0.015 }

name: pages

# The only workflow that deploys GitHub Pages: API docs (site root, URLs
# unchanged) + signed apt/ and rpm/ repositories built from the newest
# releases' .deb/.rpm assets. Pages is stateless, so every run rebuilds all.
on:
  push:
    # release-packaging is TEMPORARY: a workflow can only be dispatched once its file exists on the
    # default branch, so the branch push registers it. Branch pushes never deploy (see deploy.if).
    # Remove release-packaging after the merge to main.
    branches: [main, release-packaging]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the site and upload it as an artifact; do not deploy"
        type: boolean
        default: true
      run_id:
        description: "Take the Linux packages from this release.yml run's pkg-linux-* artifacts instead of releases (for dry runs before a packaged release exists)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: ./.github/workflows/docs.yml

  repos:
    needs: docs
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      RUN_ID: ${{ inputs.run_id }}
      # Pages limit is 1 GB; keep 100 MB of headroom.
      SITE_LIMIT_BYTES: "900000000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-html
          path: site

      - name: Install repo tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c

      - name: Gather packages (newest N releases that fit the size budget)
        id: gather
        run: |
          set -euo pipefail
          mkdir pkgs
          if [ -n "$RUN_ID" ]; then
            echo "Dry-run input: packages from run $RUN_ID"
            gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -p 'pkg-linux-*' -D dl
            # Only the verified artifacts: the aarch64 build job also uploads
            # pkg-linux-aarch64-unverified with the same file names, before the native test job ran.
            find dl -path '*-unverified*' -prune -o \( -name '*.deb' -o -name '*.rpm' \) -print0 \
              | xargs -0 cp -t pkgs
          else
            docs_bytes="$(du -sb site | cut -f1)"
            budget=$((SITE_LIMIT_BYTES - docs_bytes))
            echo "docs: $docs_bytes bytes; package budget: $budget bytes"
            gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' > tags.txt
            : > rel.ndjson
            while read -r tag; do
              gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets \
                | jq -c --arg t "$tag" '{tag: $t, bytes: ([.assets[] | select(.name | test("\\.(deb|rpm)$")) | .size] | add // 0)}' >> rel.ndjson
            done < tags.txt
            rc=0
            picked="$(jq -s . rel.ndjson | tools/release/pick_releases.sh "$budget")" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "$picked" | head -n1 | sed 's/^N=/Including N releases: /'
              for tag in $(echo "$picked" | tail -n +2); do
                gh release download "$tag" -R "$GITHUB_REPOSITORY" -p '*.deb' -p '*.rpm' -D pkgs
              done
            elif [ "$rc" -eq 3 ] && [ "$EVENT" = push ] && [[ "$GITHUB_REF" == refs/heads/* ]]; then
              # Branch push, and no release carries packages at all: publish the docs, loudly.
              # Any other failure (too big, tag run, dispatch, call) must fail, or Pages would drop live repos.
              echo "::warning::no release with .deb/.rpm assets yet; deploying docs without apt/rpm repositories"
            else
              exit 1
            fi
          fi
          n="$(find pkgs -type f | wc -l)"
          echo "packages gathered: $n"
          if [ "$n" -gt 0 ]; then echo "have_pkgs=true" >> "$GITHUB_OUTPUT"; else echo "have_pkgs=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build signed apt + yum repositories
        if: steps.gather.outputs.have_pkgs == 'true'
        env:
          OVERLUME_GPG_PRIVATE_KEY: ${{ secrets.OVERLUME_GPG_PRIVATE_KEY }}
          OVERLUME_GPG_PASSPHRASE: ${{ secrets.OVERLUME_GPG_PASSPHRASE }}
          OVERLUME_GPG_FINGERPRINT: ${{ secrets.OVERLUME_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          tools/release/build_apt_repo.sh pkgs site
          tools/release/build_yum_repo.sh pkgs site
          # The key served to users must be the one that signed.
          got="$(gpg --show-keys --with-colons site/overlume-release.asc | awk -F: '/^fpr:/ {print $10; exit}')"
          [ "$got" = "$OVERLUME_GPG_FINGERPRINT" ] || { echo "FAIL: served key != OVERLUME_GPG_FINGERPRINT"; exit 1; }
          cmp site/overlume-release.asc packaging/keys/overlume-release.asc \
            || { echo "FAIL: served key differs from packaging/keys/overlume-release.asc"; exit 1; }

      - name: Check site size
        run: |
          set -euo pipefail
          bytes="$(du -sb site | cut -f1)"
          echo "site: $bytes bytes (limit $SITE_LIMIT_BYTES)"
          [ "$bytes" -lt "$SITE_LIMIT_BYTES" ] || { echo "FAIL: site too large for Pages"; exit 1; }
          test -f site/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: repos
    # Dry runs never deploy: inputs.dry_run is null on a direct push (deploys from main only). Branch pushes
    # never deploy. release.yml's `pages` job dispatches this on main with dry_run=false once a release is
    # public (the github-pages environment only accepts main, so there is no tag or workflow_call path).
    if: ${{ !inputs.dry_run && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

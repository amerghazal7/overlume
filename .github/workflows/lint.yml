name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install clang-format
        # Reads tools/check_format.sh's own PINNED_VERSION="x.y.z" so this
        # workflow can never drift from what that script actually enforces
        # (currently clang-format 23.1.1, per that script's header). Falls
        # back to a placeholder only if that variable is ever missing/renamed.
        run: |
          version=""
          if [ -f tools/check_format.sh ]; then
            version=$(grep -oE 'PINNED_VERSION="[0-9][0-9.]*"' tools/check_format.sh \
              | grep -oE '[0-9][0-9.]*' | head -1 || true)
          fi
          if [ -z "$version" ]; then
            echo "::warning::Could not read PINNED_VERSION from tools/check_format.sh; using a placeholder (23.1.1). Reconcile with that script's actual pin."
            version="23.1.1"
          fi
          echo "Installing clang-format==$version"
          python -m pip install --user "clang-format==$version"

      - name: Format check
        run: tools/check_format.sh

      - name: SPDX header check
        run: tools/check_spdx.sh

      - name: Install shellcheck
        # ubuntu-* GitHub-hosted runners ship shellcheck preinstalled; this
        # is normally a fast no-op and just pins us to a known-present tool
        # rather than trusting the runner image's bundled version.
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: |
          shellcheck --severity=error tools/*.sh overlume/scripts/*.sh overlume/tools/*.sh \
            ros/colcon_build.sh ros/src/overlume_ros/scripts/*.sh

      - name: Python syntax check (py_compile)
        run: |
          python3 -m py_compile tools/*.py ros/src/overlume_ros/test/*.py

      - name: Python unit tests (pytest tools/ subset)
        # ROS/rclpy-, websockets-, PyGObject (gi)- and ros/install-dependent
        # cases in this suite skip themselves (pytest.importorskip /
        # skipif) when those aren't present on this runner — see
        # tools/test_vcam_ws_bridge.py. No colcon/rclpy install here; this
        # only exercises the plain-Python subset.
        run: |
          python -m pip install --user -r tools/requirements.txt
          python -m pytest tools/ -q

      - name: Docs link check
        run: python3 tools/check_docs_links.py

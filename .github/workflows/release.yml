name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and sign everything but publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  create:
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify tag matches version.h
        run: |
          tag="${GITHUB_REF_NAME#v}"
          major=$(grep -oE '^#define OVERLUME_VERSION_MAJOR [0-9]+' overlume/include/overlume/version.h | grep -oE '[0-9]+$')
          minor=$(grep -oE '^#define OVERLUME_VERSION_MINOR [0-9]+' overlume/include/overlume/version.h | grep -oE '[0-9]+$')
          patch=$(grep -oE '^#define OVERLUME_VERSION_PATCH [0-9]+' overlume/include/overlume/version.h | grep -oE '[0-9]+$')
          header_version="${major}.${minor}.${patch}"
          echo "Tag version: $tag / version.h: $header_version"
          if [ "$tag" != "$header_version" ]; then
            echo "::error::Tag v$tag does not match overlume/include/overlume/version.h ($header_version)"
            exit 1
          fi

      - name: Extract CHANGELOG section
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v ver="$tag" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found = 1; next }
            }
            /^\[.*\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $tag"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md

  package:
    needs: create
    if: ${{ !cancelled() && (needs.create.result == 'success' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  os: ubuntu-22.04,     container_arch: x86_64 }
          # linux-aarch64 is cross-built on x86_64 and tested natively on arm64:
          # package-linux-aarch64-build + package-linux-aarch64 below.
    runs-on: ${{ matrix.os }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      IMAGE: overlume-release-linux:${{ matrix.container_arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          # The write token must not land in .git/config: this checkout is
          # mounted into the build and signing containers.
          persist-credentials: false

      - name: Cache release image
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/overlume-image.tar
          key: overlume-image-${{ matrix.container_arch }}-${{ hashFiles('tools/release/linux/Dockerfile') }}

      - name: Build or load release image
        run: |
          if [ -f "$RUNNER_TEMP/overlume-image.tar" ]; then
            docker load -i "$RUNNER_TEMP/overlume-image.tar"
          else
            docker build -t "$IMAGE" tools/release/linux
            docker save -o "$RUNNER_TEMP/overlume-image.tar" "$IMAGE"
          fi

      - name: Cache Filament source build and vcpkg
        uses: actions/cache@v4
        with:
          path: |
            overlume/build-release/_deps
            ${{ runner.temp }}/overlume-home
          key: overlume-deps-${{ matrix.container_arch }}-${{ hashFiles('overlume/cmake/**', 'tools/release/linux/Dockerfile') }}

      - name: Configure, build, test, package (container)
        run: |
          mkdir -p "$RUNNER_TEMP/overlume-home"
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/home/h \
            -v "$RUNNER_TEMP/overlume-home":/home/h -v "$PWD":/src -w /src "$IMAGE" bash -euo pipefail -c '
              cmake --toolchain /src/overlume/cmake/toolchain-llvm-release.cmake \
                    -S overlume -B overlume/build-release -G Ninja \
                    -DCMAKE_BUILD_TYPE=Release -DOVERLUME_ENABLE_CESIUM=ON \
                    -DOVERLUME_BUILD_DOCS=OFF -DOVERLUME_BUILD_EXAMPLES=OFF \
                    -DOVERLUME_FILAMENT_FROM_SOURCE=ON
              cmake --build overlume/build-release
              # glibc floor: liboverlume.so must not need anything newer than 2.28.
              tools/release/check_glibc_floor.sh overlume/build-release/liboverlume.so.0
              # FiftyObjectsSceneUpdateUnderTwoMilliseconds is a wall-clock budget that
              # llvmpipe cannot meet (docs/status.md, known gap 11).
              ctest --test-dir overlume/build-release -L cpu --output-on-failure \
                    -E FiftyObjectsSceneUpdateUnderTwoMilliseconds
              cpack --config overlume/build-release/CPackConfig.cmake -B /src/overlume/build-release/pkg
              tools/release/check_package_elf.sh overlume/build-release/pkg X86-64
            '

      - name: Sign rpm packages
        env:
          OVERLUME_GPG_PRIVATE_KEY: ${{ secrets.OVERLUME_GPG_PRIVATE_KEY }}
          OVERLUME_GPG_PASSPHRASE: ${{ secrets.OVERLUME_GPG_PASSPHRASE }}
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e OVERLUME_GPG_PRIVATE_KEY -e OVERLUME_GPG_PASSPHRASE \
            -v "$PWD":/src -w /src "$IMAGE" tools/release/sign_rpms.sh overlume/build-release/pkg

      - name: Collect packages
        run: |
          mkdir out
          cp overlume/build-release/pkg/*.deb overlume/build-release/pkg/*.rpm \
             overlume/build-release/pkg/*.tar.gz out/
          ls -l out

      - name: Clean-room install matrix
        run: tools/package_smoke_test.sh out

      - name: Checksums and detached signature
        env:
          OVERLUME_GPG_PRIVATE_KEY: ${{ secrets.OVERLUME_GPG_PRIVATE_KEY }}
          OVERLUME_GPG_PASSPHRASE: ${{ secrets.OVERLUME_GPG_PASSPHRASE }}
        run: tools/release/sign_sums.sh out "${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      - name: Upload release assets
        if: ${{ env.DRY_RUN != 'true' && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

  # aarch64 is cross-compiled here (x86_64 runner, Alma 8 aarch64 sysroot, see
  # tools/release/linux/Dockerfile.cross-aarch64) and tested natively by
  # package-linux-aarch64 on an arm64 runner. Nothing is signed (beyond the rpm
  # signature the clean-room test checks) or published from this job.
  package-linux-aarch64-build:
    needs: create
    if: ${{ !cancelled() && (needs.create.result == 'success' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      IMAGE: overlume-release-linux:cross-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Cache cross release image
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/overlume-image.tar
          key: overlume-image-cross-aarch64-${{ hashFiles('tools/release/linux/Dockerfile', 'tools/release/linux/Dockerfile.cross-aarch64') }}

      - name: Build or load cross release image
        run: |
          if [ -f "$RUNNER_TEMP/overlume-image.tar" ]; then
            docker load -i "$RUNNER_TEMP/overlume-image.tar"
          else
            docker build -t overlume-release-linux:x86_64 tools/release/linux
            docker build -f tools/release/linux/Dockerfile.cross-aarch64 -t "$IMAGE" tools/release/linux
            docker save -o "$RUNNER_TEMP/overlume-image.tar" "$IMAGE"
          fi

      - name: Cache Filament source build and vcpkg
        uses: actions/cache@v4
        with:
          path: |
            overlume/build-release-aarch64/_deps
            ${{ runner.temp }}/overlume-home
          key: overlume-deps-aarch64-cross-${{ hashFiles('overlume/cmake/**', 'tools/release/linux/Dockerfile', 'tools/release/linux/Dockerfile.cross-aarch64') }}

      - name: Cross-configure, build, package (container)
        run: |
          mkdir -p "$RUNNER_TEMP/overlume-home" test-bundle
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/home/h \
            -v "$RUNNER_TEMP/overlume-home":/home/h -v "$PWD":/src -w /src "$IMAGE" bash -euo pipefail -c '
              b=overlume/build-release-aarch64
              cmake --toolchain /src/overlume/cmake/toolchain-llvm-release-aarch64.cmake \
                    -S overlume -B "$b" -G Ninja \
                    -DCMAKE_BUILD_TYPE=Release -DOVERLUME_ENABLE_CESIUM=ON \
                    -DOVERLUME_BUILD_DOCS=OFF -DOVERLUME_BUILD_EXAMPLES=OFF \
                    -DOVERLUME_FILAMENT_FROM_SOURCE=ON
              cmake --build "$b"
              # Foreign-arch ELF: LLVM binutils. The native floor/export checks repeat on arm64.
              export OBJDUMP=/opt/llvm/bin/llvm-objdump READELF=/opt/llvm/bin/llvm-readelf
              tools/release/check_glibc_floor.sh "$b/liboverlume.so.0"
              overlume/scripts/check_shared_exports.sh /opt/llvm/bin/llvm-nm "$READELF" "$b/liboverlume.so.0"
              cpack --config "$b/CPackConfig.cmake" -B "/src/$b/pkg"
              tools/release/check_package_elf.sh "$b"/pkg AArch64
              tools/release/make_test_bundle.sh "$b" test-bundle/overlume-aarch64-tests.tar.gz
            '

      - name: Sign rpm packages
        env:
          OVERLUME_GPG_PRIVATE_KEY: ${{ secrets.OVERLUME_GPG_PRIVATE_KEY }}
          OVERLUME_GPG_PASSPHRASE: ${{ secrets.OVERLUME_GPG_PASSPHRASE }}
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e OVERLUME_GPG_PRIVATE_KEY -e OVERLUME_GPG_PASSPHRASE \
            -v "$PWD":/src -w /src "$IMAGE" tools/release/sign_rpms.sh overlume/build-release-aarch64/pkg

      - name: Collect packages
        run: |
          mkdir out
          cp overlume/build-release-aarch64/pkg/*.deb overlume/build-release-aarch64/pkg/*.rpm \
             overlume/build-release-aarch64/pkg/*.tar.gz out/
          ls -l out test-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-aarch64-unverified
          path: out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: tests-linux-aarch64
          path: test-bundle/*
          if-no-files-found: error

  # Native arm64: the cross-built tests in an almalinux:8 container (glibc 2.28
  # for real), then the clean-room install matrix. Checksums, their signature
  # and the release upload exist only after both pass.
  package-linux-aarch64:
    needs: package-linux-aarch64-build
    if: ${{ !cancelled() && needs.package-linux-aarch64-build.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04-arm
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: pkg-linux-aarch64-unverified
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: tests-linux-aarch64
          path: test-bundle

      - name: Unpack the test bundle
        run: tar -xzf test-bundle/overlume-aarch64-tests.tar.gz

      - name: Native cpu tests (almalinux:8 arm64)
        run: docker run --rm -v "$PWD":/src -w /src almalinux:8 bash tools/release/linux/test_aarch64.sh

      - name: Clean-room install matrix
        run: tools/package_smoke_test.sh out

      - name: Checksums and detached signature
        env:
          OVERLUME_GPG_PRIVATE_KEY: ${{ secrets.OVERLUME_GPG_PRIVATE_KEY }}
          OVERLUME_GPG_PASSPHRASE: ${{ secrets.OVERLUME_GPG_PASSPHRASE }}
        run: tools/release/sign_sums.sh out linux-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-aarch64
          path: out/*
          if-no-files-found: error

      - name: Upload release assets
        if: ${{ env.DRY_RUN != 'true' && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

  # Android: one build job per ABI in the Alma 8 release image (host LLVM for Filament's host tools
  # and vcpkg's host triplet) with NDK r27c from tools/android/setup_sdk.sh, mounted at the same
  # absolute path the host sees so ctest can run on the runner. x86_64 and x86 also run the tests on
  # an API 30 emulator; arm64-v8a / armeabi-v7a are build + export checks only (no hosted ARM emulator).
  package-android-build:
    needs: create
    if: ${{ !cancelled() && (needs.create.result == 'success' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a,   emulator: "" }
          - { abi: armeabi-v7a, emulator: "" }
          - { abi: x86_64,      emulator: x86_64 }
          - { abi: x86,         emulator: x86 }
    runs-on: ubuntu-22.04
    env:
      IMAGE: overlume-release-linux:x86_64
      OVERLUME_ANDROID_HOME: ${{ github.workspace }}/../overlume-android
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Cache release image
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/overlume-image.tar
          key: overlume-image-x86_64-${{ hashFiles('tools/release/linux/Dockerfile') }}

      - name: Build or load release image
        run: |
          if [ -f "$RUNNER_TEMP/overlume-image.tar" ]; then
            docker load -i "$RUNNER_TEMP/overlume-image.tar"
          else
            docker build -t "$IMAGE" tools/release/linux
            docker save -o "$RUNNER_TEMP/overlume-image.tar" "$IMAGE"
          fi

      - name: NDK r27c (pinned sha256)
        run: tools/android/setup_sdk.sh ndk

      - name: Cache Filament source build and vcpkg
        uses: actions/cache@v4
        with:
          path: |
            overlume/build-android-${{ matrix.abi }}/_deps
            ${{ runner.temp }}/overlume-home
          key: overlume-deps-android-${{ matrix.abi }}-${{ hashFiles('overlume/cmake/**', 'tools/release/linux/Dockerfile') }}

      - name: Configure, build, package (container)
        run: |
          mkdir -p "$RUNNER_TEMP/overlume-home"
          ndk="$OVERLUME_ANDROID_HOME/android-ndk-r27c"
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/home/h -e ANDROID_NDK_HOME="$ndk" \
            -v "$RUNNER_TEMP/overlume-home":/home/h -v "$ndk":"$ndk":ro -v "$PWD":"$PWD" -w "$PWD" \
            "$IMAGE" bash -euo pipefail -c '
              tools/android/build_all_abis.sh ${{ matrix.abi }}
              b=overlume/build-android-${{ matrix.abi }}
              cpack --config "$b/CPackConfig.cmake" -B "$PWD/$b/pkg"
            '

      - name: Host-runnable checks (exports, POD header, triplet mapping)
        run: ANDROID_NDK_HOME="$OVERLUME_ANDROID_HOME/android-ndk-r27c" tools/android/host_checks.sh overlume/build-android-${{ matrix.abi }}
      - name: Emulator script self-test (fake adb/ctest)
        run: tools/android/test_emulator_script.sh overlume/build-android-${{ matrix.abi }}

      - name: Enable KVM
        if: ${{ matrix.emulator != '' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # gtest_discover_tests (PRE_TEST) bakes the container CMake's module path into the build dir,
      # so the runner's ctest must be the container's, at the same prefix.
      - name: Install the container's CMake/ctest on the runner
        if: ${{ matrix.emulator != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/cm"
          docker run --rm -v "$RUNNER_TEMP/cm":/out "$IMAGE" bash -c 'cp -r /usr/local/bin/cmake /usr/local/bin/ctest /usr/local/share/cmake-* /out/'
          sudo cp -rf "$RUNNER_TEMP"/cm/cmake-* /usr/local/share/
          sudo install -m755 "$RUNNER_TEMP/cm/cmake" "$RUNNER_TEMP/cm/ctest" /usr/local/bin/
          ctest --version | head -1

      - name: Unpack this ABI's package for the consumer check
        if: ${{ matrix.emulator != '' }}
        run: |
          mkdir -p consumer/${{ matrix.abi }}
          unzip -q overlume/build-android-${{ matrix.abi }}/pkg/overlume-*-android-${{ matrix.abi }}.zip -d consumer/${{ matrix.abi }}

      # swangle_indirect (ANGLE on SwiftShader Vulkan, ES 3.1) is required: the plain swiftshader_indirect
      # ES 3.0 translator renders all-black frames once post-processing is on.
      - name: Tests and consumer smoke on an API 30 emulator
        if: ${{ matrix.emulator != '' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ env.OVERLUME_ANDROID_HOME }}/android-ndk-r27c
        with:
          api-level: 30
          target: google_apis
          arch: ${{ matrix.emulator }}
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            tools/android/run_tests_on_emulator.sh overlume/build-android-${{ matrix.abi }}
            RUN_ON_DEVICE=1 tools/android/check_consumer.sh consumer ${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-zip-${{ matrix.abi }}
          path: overlume/build-android-${{ matrix.abi }}/pkg/overlume-*-android-${{ matrix.abi }}.zip
          if-no-files-found: error

  package-android:
    needs: package-android-build
    if: ${{ !cancelled() && needs.package-android-build.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      OVERLUME_ANDROID_HOME: ${{ github.workspace }}/../overlume-android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: android-zip-*
          path: abi-zips
          merge-multiple: true

      - name: NDK r27c (pinned sha256)
        run: tools/android/setup_sdk.sh ndk

      - name: Merge ABIs, Prefab AAR
        run: |
          export ANDROID_NDK_HOME="$OVERLUME_ANDROID_HOME/android-ndk-r27c"
          mkdir out
          tools/android/build_aar.sh abi-zips out
          mkdir unzipped && unzip -q out/overlume-*-android.zip -d unzipped
          for a in arm64-v8a armeabi-v7a x86 x86_64; do
            [ -d "unzipped/$a/lib" ] || { echo "::error::android zip lacks ABI $a"; exit 1; }
          done
          tools/android/check_consumer.sh unzipped
          tools/android/check_prefab.sh out/overlume-*-android.aar

      - name: Publish script against the local Central Portal stub
        run: tools/release/test_maven_publish.sh "$(ls out/overlume-*-android.aar)"

      - name: Maven Central bundle
        env:
          OVERLUME_GPG_PRIVATE_KEY: ${{ secrets.OVERLUME_GPG_PRIVATE_KEY }}
          OVERLUME_GPG_PASSPHRASE: ${{ secrets.OVERLUME_GPG_PASSPHRASE }}
        run: tools/release/build_maven_bundle.sh out/overlume-*-android.aar maven/overlume-maven-bundle.zip

      - name: Checksums and detached signature
        env:
          OVERLUME_GPG_PRIVATE_KEY: ${{ secrets.OVERLUME_GPG_PRIVATE_KEY }}
          OVERLUME_GPG_PASSPHRASE: ${{ secrets.OVERLUME_GPG_PASSPHRASE }}
        run: tools/release/sign_sums.sh out android

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-android
          path: out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: maven-bundle
          path: maven/overlume-maven-bundle.zip
          if-no-files-found: error

      - name: Upload release assets
        if: ${{ env.DRY_RUN != 'true' && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

  # Dry runs (and any non-tag run) validate the bundle with Central and drop it; only a tag
  # push publishes. The portal checks the signature against public keyservers, so the release
  # key must be on keyserver.ubuntu.com and keys.openpgp.org.
  publish-maven:
    needs: package-android
    if: ${{ !cancelled() && needs.package-android.result == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: maven-bundle
          path: maven

      - name: Central Portal (validate-and-drop, or publish on a tag)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          mode=validate
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF_TYPE" = tag ]; then mode=publish; fi
          tools/release/publish_maven_central.sh maven/overlume-maven-bundle.zip "$mode"

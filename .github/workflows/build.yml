name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install EGL/GLES dev headers
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/overlume-toolchain-cesium
          key: ${{ runner.os }}-overlume-toolchain-cesium-${{ hashFiles('overlume/scripts/setup_toolchain_cesium.sh') }}

      - name: Bootstrap toolchain
        run: overlume/scripts/setup_toolchain_cesium.sh

      - name: Configure (Cesium OFF, docs OFF — CPU-only, no GPU runner here)
        run: |
          cmake --toolchain "$PWD/overlume/cmake/toolchain-clang-libcxx.cmake" \
              -B overlume/build -S overlume \
              -DOVERLUME_ENABLE_CESIUM=OFF \
              -DOVERLUME_BUILD_DOCS=OFF

      - name: Build library + examples
        run: cmake --build overlume/build -j

      - name: Run non-GPU tests
        working-directory: overlume/build
        run: |
          if ctest -N -L cpu 2>&1 | grep -q 'Total Tests: 0'; then
            echo "::warning::'cpu' ctest label matched zero tests; falling back to 'ctest -LE gpu' (GPU-labeled tests are expected to hard-fail, not skip, on this runner)."
            selector="-LE gpu"
          else
            selector="-L cpu"
          fi
          if ctest -N $selector 2>&1 | grep -q 'Total Tests: 0'; then
            echo "::error::ctest $selector matched zero tests — refusing to report a false green."
            exit 1
          fi
          ctest $selector --output-on-failure

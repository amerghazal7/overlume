# fog_color_white_dark.yaml — test fixture for test_theme.cpp's Fog.ColorAffectsRenderedOutput
# (dark_adas branch, epic1 Task 2 review round 5). Byte-for-byte identical
# to assets/themes/dark_adas.yaml (including its fog.density) except
# `palette.fog` -- the only thing that can make the two renders differ is
# FogOptions::color actually reaching the screen for THIS theme's own
# ibl.intensity, not just light_clay's (see fog_color_{black,white}.yaml
# above, which only exercised light_clay's branch of the color-scale
# formula and missed a dead dark_adas token in review round 4). Measured:
# unfixed round-4 code (kFogAmbientReferenceIntensitySq/ibl.intensity^2)
# moves the mean by 5.33 between black and white fog here -- below the
# >15.0 liveness bar; the round-5 fix moves it by ~166.
name: fog_color_white_dark
palette:
  ground:      [0.05, 0.06, 0.08]
  sky:         [0.02, 0.02, 0.05]
  fog:         [1.0, 1.0, 1.0]
  lane_paint:  [0.45, 0.5, 0.55]
  ribbon_core: [0.10, 1.00, 0.40]
  ribbon_glow: [0.10, 1.00, 0.40]
  object_tints:
    car: [0.25, 0.35, 0.9]
    truck_van: [0.30, 0.35, 0.85]
    bus: [0.85, 0.6, 0.15]
    pedestrian: [0.9, 0.2, 0.2]
    cyclist: [0.9, 0.55, 0.1]
    unknown: [0.5, 0.5, 0.5]
  alert:
    info: [0.2, 0.6, 1.0]
    warning: [1.0, 0.7, 0.1]
    critical: [1.0, 0.15, 0.1]
material: { roughness: 0.85, metallic: 0.0 }
emissive: { ribbon_strength: 4.0 }
grid: { line_color: [0.12, 0.14, 0.18], fade_start_m: 15.0, fade_end_m: 40.0 }
hud: { text_color: [0.9, 0.95, 1.0], accent_color: [0.10, 1.0, 0.4], scale: 1.0 }
sun: { direction: [-0.5, -0.3, -1.0], color: [0.55, 0.6, 0.75], intensity: 480000.0 }
ibl:  # analytic 2-band hemisphere gradient — NOT raw SH coefficients
  sky_color:    [0.05, 0.06, 0.12]
  ground_color: [0.02, 0.02, 0.03]
  intensity: 256000.0
# density raised from the original 0.015 (epic1 Task 2 review round 5):
# at 0.015 there wasn't enough fog mass for palette.fog to have any live
# effect on the rendered frame without also overshooting the horizon/sky
# convergence guard (tests/test_theme.cpp) -- see renderer.cpp's
# setFogOptions() comment for the measured sweep. 0.10 is the first value
# with real headroom on both the liveness (Fog.ColorAffectsRenderedOutput)
# and convergence (ThemeGolden horizon_row_mean/sky_row_mean) guards.
fog: { density: 0.10 }

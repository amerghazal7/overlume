# dark_ref2.yaml — CANDIDATE, not shipped. "Dark equivalent for the same
# vibes and looks" as light_ref2.yaml (user's own words) -- same soft matte
# clay, same low-contrast/airy read, same three accents (hero
# ribbon/hazard/lane gold), just re-keyed dark. NOT black-plus-neon: every
# surface token stays a soft, muted clay tone, never a saturated
# glow-in-the-dark hue. All values LINEAR RGB (see theme.hpp's header
# comment).
#
# Same key set as assets/themes/dark_adas.yaml, no exceptions (theme.cpp's
# loader has no per-theme branches). Lives in assets/theme_variants/ (NOT
# assets/themes/) — a candidate under iteration, not a shipped theme.
#
# Palette core tokens below are the orchestrator's seed, sampled to keep
# ref-2's inverted-luminance relationships intact (building lightest, road
# keeps its periwinkle DNA of B > R) rather than re-derived from scratch —
# this file's own job is filling in everything the seed didn't specify
# (lighting, HUD, the non-named object tints) so the seed actually renders
# as a coherent scene, not just a palette table.
name: dark_ref2
palette:
  # Deep, cool near-black -- same role as dark_adas's own near-black sky,
  # re-keyed with the periwinkle-family B > R the whole palette shares.
  sky:         [0.028, 0.036, 0.085]
  # Ground: a touch lighter than sky (ambient-lit dusk read, not a flat
  # single value) -- same B >= R periwinkle lean.
  ground:      [0.055, 0.055, 0.078]
  # Must equal palette.sky exactly -- fog==sky convergence convention every
  # shipped theme follows.
  fog:         [0.028, 0.036, 0.085]
  # Ref-2's "lane white" -- IDENTICAL value whether the surrounding theme is
  # light or dark: lane paint is retroreflective/bright by design in both
  # daylight and dusk, which is exactly why it still pops here despite
  # everything around it being near-black. Not toned down for the "low
  # contrast" mandate -- lane markings are the one surface meant to break
  # that low contrast on purpose (the whole reason they're painted).
  lane_paint:  [0.85, 0.85, 0.88]
  # Hero/BEHAVIOR ribbon: azure, matching light_ref2's own hero exactly —
  # see this file's bottom-of-file note on the deliberate green->azure
  # change this makes relative to the SHIPPED dark_adas.yaml (untouched by
  # this pass).
  ribbon_core: [0.12, 0.55, 0.42]
  ribbon_glow: [0.12, 0.55, 0.42]
  # GLOBAL/LOCAL: same blue/warm-tan pairing convention as every shipped
  # theme, muted well below the hero azure's saturation so the hero still
  # reads as THE accent, not one of three equals.
  ribbon_global: [0.22, 0.30, 0.42]
  ribbon_local:  [0.55, 0.42, 0.22]
  # "Light clay, inverted contrast" (user/seed) -- the LIGHTEST token in
  # this entire palette, deliberately brighter than `building` (the
  # lightest SURFACE), so the ego still reads as a hard silhouette against
  # every clay tone around it -- same contrast-pop INTENT as every shipped
  # theme's palette.ego, inverted because the whole scene it stands on is
  # inverted.
  ego: [0.82, 0.80, 0.76]
  # Periwinkle DNA (B > R) explicitly kept per the seed's own note -- the
  # road plane stays legible as "the same road" whether the theme is light
  # or dark, just at dusk luminance.
  road: [0.034, 0.042, 0.078]
  # Faint dot guidance: 25% lane_paint / 75% road (same mix convention as
  # every shipped theme) = 0.25*[0.85,0.85,0.88] + 0.75*[0.034,0.042,0.078]
  # = [0.238, 0.244, 0.279]. Recompute if either moves.
  lane_centerline: [0.238, 0.244, 0.279]
  lane_boundary: [0.85, 0.85, 0.88]
  # Road's outer boundary, solid never dashed -- ref-2's "lane gold",
  # authored nearer the user's stated de-JPEG-softened value
  # ([0.720,0.520,0.090], the seed's own number) rather than a re-softened
  # guess.
  road_edge: [0.720, 0.520, 0.090]
  # Crosswalk: not named by the seed -- a warm tan in the same family as
  # road_edge's gold but noticeably dimmer, so it reads as "lit road paint"
  # rather than competing with road_edge's own solid stripe for the same
  # visual role.
  crosswalk: [0.42, 0.36, 0.22]
  # Lightest MASS in the scene (not counting the lane paints or ego) --
  # mirrors ref-2's own inversion (buildings are the brightest surface
  # there too), per the seed's explicit note.
  building: [0.130, 0.135, 0.180]
  object_tints:
    # Ref-2's traffic vehicle, unchanged tint whether the theme is light or
    # dark (same reasoning as lane_paint above: this is the one hue meant
    # to read as "the same car", just under dusk light) -- pale and
    # receding relative to the ego/hero/hazard accents.
    car: [0.180, 0.210, 0.320]
    truck_van: [0.28, 0.32, 0.55]
    bus: [0.75, 0.55, 0.20]
    pedestrian: [0.85, 0.25, 0.25]
    cyclist: [0.80, 0.50, 0.15]
    unknown: [0.45, 0.45, 0.50]
  alert:
    # info/warning: not named by the seed -- conventional blue/amber, kept
    # legible against the near-black ground without competing with the
    # hero azure or the critical coral below.
    info: [0.20, 0.55, 0.85]
    warning: [0.85, 0.60, 0.15]
    # The seed's own hazard value -- ref-2's coral, was going to stay
    # unchanged from light_ref2's critical (same "one hue, both themes"
    # reasoning as lane_paint/car above), but nudged 2026-09-16 (round-2
    # gate finding, minor -- "worth a nudge") once the review's own four
    # alert-pixel samples showed R-B ~+19-20 here (#BD7FAA, magenta-pink,
    # not coral) against the shipped-theme baselines it compared to
    # (light_clay +10, dark_adas +73). Unlike light_ref2, this theme's
    # alert blends over a near-black road/ground, so the CRITICAL polygon's
    # fixed 0.45 blend alpha (renderer_internal.hpp) doesn't fight a bright
    # saturated background -- a modest saturation bump was enough: R-B at
    # the same four review pixels went from ~+19 to ~+55, clearing the
    # >=+30 bar with room, and the crop reads as coral/rose, not magenta.
    critical: [0.90, 0.20, 0.15]
# Matte clay throughout, same as dark_adas's own roughness -- no metal, no
# specular pop (user: "same soft matte clay").
material: { roughness: 0.85, metallic: 0.0 }
# Glow killed, same as every shipped theme AND explicitly what "not
# black-plus-neon" rules out -- the hero ribbon reads as flat saturated
# paint, never a bloom source.
emissive: { ribbon_strength: 0.0 }
# Grid line: lighter than `ground` so it's readable against it, landing in
# the same tonal family as `building` (both are "the lightest clay
# surfaces" here) rather than dark_adas's own cooler steel-blue grid.
grid: { line_color: [0.130, 0.130, 0.180], fade_start_m: 15.0, fade_end_m: 40.0 }
# HUD ink light (reads against the dark scene); accent reuses the hero
# azure rather than dark_adas's neon-green accent -- ties the HUD to this
# palette's own accent identity instead of carrying over a color this
# theme deliberately moves away from (see the bottom-of-file note).
hud: { text_color: [0.90, 0.92, 0.95], accent_color: [0.12, 0.60, 0.45], scale: 1.0 }
# Sun: LOW, grazing angle (mostly-horizontal direction vector, unlike
# dark_adas's near-straight-down -1.0 z) -- a genuine dusk sun sits near the
# horizon, not overhead; a warm dusk color instead of dark_adas's cool
# blue-gray sun, and a lower intensity than dark_adas's 480000 because the
# IBL fill below is doing more of the "airy, not crushed black" work here,
# not a single harsh directional key light.
sun: { direction: [-0.6, -0.2, -0.5], color: [0.85, 0.65, 0.55], intensity: 300000.0 }
ibl:
  # Tracks palette.sky/ground per the shipped convention. intensity set
  # ABOVE dark_adas's own 256000 -- this palette's ground/building tokens
  # are measurably brighter than dark_adas's (the seed's own "airy... not
  # crushed black" mandate), so the ambient fill needs to be stronger to
  # actually put that extra light in the scene rather than just raising the
  # albedo numbers on paper.
  sky_color:    [0.028, 0.036, 0.085]
  ground_color: [0.030, 0.030, 0.045]
  intensity: 300000.0
# Same order of magnitude as dark_adas's own 0.015 (this is still a dark,
# somewhat hazy scene) but nudged up for the airier dusk read the seed asks
# for -- more atmosphere around the buildings, not a clearer/harder scene.
fog: { density: 0.010 }
# Unchanged from the shipped geometry convention -- this pass is a palette
# direction, not a ribbon-shape change.
ribbon: { lane_width_m: 3.5, margin_behavior_m: 1.3, margin_global_m: 0.3, margin_local_m: 0.8 }
# Unchanged from the shipped convention (VM-078's semi-transparent-by-default
# decision) -- not part of this palette direction either.
objects: { opacity: 0.25 }

# ── Hero ribbon: GREEN, per the user's explicit call (2026-09-16) ───────────
# An earlier revision of this candidate made the hero azure to mirror
# light_ref2, on the reading that "same vibes" meant one shared accent. The
# user looked at it rendered and decided otherwise: dark KEEPS its green
# hero ([0.12, 0.55, 0.42], the shipped dark_adas value). So the deliberate
# dark-green / light-blue split that dark_adas.yaml's own comment describes
# SURVIVES this re-palette -- the two themes share a ground/building/road
# language and the coral+gold accents, but not the hero colour.
# hud.accent_color tracks the hero, so it moved back with it.

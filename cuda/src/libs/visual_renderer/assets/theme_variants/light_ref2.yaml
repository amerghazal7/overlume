# light_ref2.yaml — CANDIDATE, not shipped. Palette measured off
# assets/visualization-reference-2.jpg by color signature (user-approved
# direction, 2026-09-16 palette-iteration session); every value below is
# LINEAR RGB, same convention as assets/themes/*.yaml (see theme.hpp's
# header comment — no sRGB decode happens anywhere in the loader).
#
# Same key set as assets/themes/light_clay.yaml, no exceptions (theme.cpp's
# loader has no per-theme branches) — this file is a drop-in
# MPVIZ_SHOWCASE_THEME_DIR target, not a schema subset.
#
# Lives in assets/theme_variants/ (NOT assets/themes/) — a candidate under
# iteration, not a shipped theme. Promote by copying into assets/themes/
# once the user picks a winner; nothing here is wired into theme.cpp's
# search path today.
name: light_ref2
palette:
  # ref-2 sky: a real, fairly saturated blue -- close to light_clay's own
  # sky (which was already grounded on this same reference image), so this
  # mostly re-confirms the existing choice rather than moving it.
  sky:         [0.355, 0.518, 0.889]
  # ref-2 ground: pale, slightly cool/lavender-leaning near-white -- lighter
  # and less saturated than light_clay's road-toned [0.58,0.58,0.64], per
  # ref-2's actual ground/pavement patches (not its road plane, see `road`
  # below).
  ground:      [0.747, 0.716, 0.748]
  # Must equal palette.sky exactly -- keeps the fog==sky convergence
  # convention every shipped theme follows (test_theme.cpp's guard tests
  # only "dark_adas"/"light_clay" by name, so this file isn't checked by
  # it directly, but the convention still keeps the horizon seam soft).
  fog:         [0.355, 0.518, 0.889]
  # "Lane white" from ref-2, measured directly off its lane paint --
  # identical to light_clay.yaml's existing lane_paint/lane_boundary value,
  # which is itself already grounded on this same reference image. Kept
  # as-is: ref-2 confirms the existing choice rather than moving it.
  lane_paint:  [0.92, 0.92, 0.90]
  # Hero/BEHAVIOR ribbon: ref-2's azure accent, the vivid "ribbon hero"
  # signature color -- distinctly more saturated/blue than light_clay's
  # existing ribbon_core, matching ref-2's actual glowing path overlay.
  ribbon_core: [0.125, 0.313, 0.905]
  ribbon_glow: [0.125, 0.313, 0.905]
  # GLOBAL/LOCAL: kept distinct from the hero azure above (same
  # blue/warm-tan pairing convention as every shipped theme) but tuned into
  # this palette's cooler, more saturated family so neither one reads as a
  # stray leftover from the old palette.
  ribbon_global: [0.40, 0.50, 0.68]
  ribbon_local:  [0.72, 0.58, 0.36]
  # ref-2's "ego (navy)" swatch -- deliberately the DARKEST token in this
  # entire palette (darker even than dark_ref2's own `road`), so the ego
  # pops as a hard silhouette against every pale/periwinkle surface around
  # it. Same cross-theme-contrast INTENT as every shipped theme's
  # palette.ego (theme.hpp's own comment), a new value here rather than a
  # literal swap since dark_ref2's ground is not this theme's ego color.
  ego: [0.080, 0.098, 0.365]
  # ref-2's signature periwinkle road plane -- the one color the user
  # singled out as "the signature". Distinctly cooler/more saturated than
  # `ground` above (B > R, periwinkle lean), same "road reads as a distinct
  # painted surface under paler surroundings" role light_clay's own road
  # already plays, just re-measured against ref-2 directly.
  road: [0.391, 0.458, 0.712]
  # Faint dot guidance: 25% lane_paint / 75% road (same mix convention as
  # every shipped theme) = 0.25*[0.92,0.92,0.90] + 0.75*[0.391,0.458,0.712]
  # = [0.523, 0.574, 0.759]. Recompute if either moves.
  lane_centerline: [0.523, 0.574, 0.759]
  # Ref-2's lane paint reads white on the road photo; boundaries dash this
  # same near-white per the shipped convention (lane_boundary ==
  # lane_paint in both existing themes).
  lane_boundary: [0.92, 0.92, 0.90]
  # Ref-2's road_edge equivalent: "lane gold", authored nearer the user's
  # stated de-JPEG-softened value ([0.810,0.620,0.150]) rather than the
  # softened sampled swatch -- road_edge renders SOLID, never dashed, so it
  # wants the more saturated, confidently-gold value, same role as every
  # shipped theme's road_edge (solid, distinct from the dashed white
  # boundaries).
  road_edge: [0.810, 0.620, 0.150]
  # Crosswalk: not one of ref-2's named swatches -- authored close to
  # light_clay's own crosswalk tan, nudged slightly toward the gold family
  # above so it reads as "the same paint, warmer" rather than an unrelated
  # third hue. Still clearly distinct from both lane_boundary's near-white
  # and road_edge's fuller gold.
  crosswalk: [0.87, 0.79, 0.56]
  # Brightest mass in ref-2 (the near-white buildings) -- an inversion of
  # dark_ref2's convention where building is ALSO the lightest token
  # relative to its own scene (mirrored intentionally, see that file's own
  # comment).
  building: [0.855, 0.838, 0.869]
  object_tints:
    # ref-2's own traffic vehicle: a pale, desaturated periwinkle-gray that
    # deliberately RECEDES against the vivid hero ribbon/ego -- the user's
    # own words, "traffic car (pale, RECEDES)". Every other tint below is
    # authored to sit in the same muted family while staying distinguishable
    # by hue alone (ref-2 doesn't single out a swatch for these).
    car: [0.657, 0.654, 0.764]
    truck_van: [0.55, 0.56, 0.66]
    bus: [0.80, 0.62, 0.34]
    pedestrian: [0.82, 0.32, 0.30]
    cyclist: [0.78, 0.55, 0.28]
    unknown: [0.60, 0.60, 0.64]
  alert:
    # info/warning: not named by ref-2 -- conventional blue/amber, tuned
    # into this palette's cooler family (same role every shipped theme's
    # info/warning play: calmer than critical, still legible).
    info: [0.22, 0.52, 0.85]
    warning: [0.88, 0.62, 0.20]
    # ref-2's coral hazard halo -- the user's own words, "soft coral-red,
    # not a harsh pure red". This is the one alert token ref-2 actually
    # measures.
    critical: [0.832, 0.357, 0.379]
# Matte clay throughout (user: "same soft matte clay") -- no metal, no
# specular pop; roughness close to light_clay's own 0.75, nudged a hair
# softer since this palette's surfaces read slightly less chalky/more
# painted than light_clay's.
material: { roughness: 0.78, metallic: 0.0 }
# Glow stays killed, same as every shipped theme -- the hero ribbon reads
# as flat saturated paint, not a bloom source. "Well lighted" here is a
# sun/IBL property (below), not an emissive one.
emissive: { ribbon_strength: 0.0 }
# Grid line: needs to read against `ground` (pale) without vanishing into
# it or fighting `road`'s periwinkle -- same ~0.67x-of-ground scale
# light_clay's own grid uses relative to ITS ground, nudged slightly blue
# to sit in this palette's periwinkle family rather than light_clay's
# neutral gray.
grid: { line_color: [0.50, 0.48, 0.54], fade_start_m: 15.0, fade_end_m: 40.0 }
# HUD ink dark enough to read on the pale ground/sky; accent reuses the
# hero azure so the HUD reads as "part of this palette", not a leftover
# green/generic accent.
hud: { text_color: [0.08, 0.10, 0.20], accent_color: [0.15, 0.40, 0.95], scale: 1.0 }
# Sun: RE-LIT 2026-09-16 (round-1 gate finding, blocking) -- a near-vertical
# direction here left vertical facades lit by IBL alone while the ground
# took the full direct key, inverting the authored albedo ordering
# (building 0.855 > ground 0.747 on paper, but building rendered DARKER
# than ground/sky in the capture). Mirrors dark_ref2.yaml's own fix: a
# grazing angle so the visible facades actually catch the key light, same
# daytime color, same overall intensity (this is still ref-2's airy
# daytime read, not dusk).
sun: { direction: [-0.6, -0.2, -0.5], color: [1.0, 0.97, 0.90], intensity: 28000.0 }
ibl:
  # Tracks palette.sky/ground per the shipped convention (both existing
  # themes' own comments: "should track palette.sky/palette.ground").
  # Intensity raised (was 9500) so ambient fill carries more of the facade
  # lighting alongside the now-grazing sun -- same "more ambient, less
  # harsh key" reasoning dark_ref2.yaml's own comment applies.
  sky_color:    [0.355, 0.518, 0.889]
  ground_color: [0.62, 0.60, 0.64]
  intensity: 15000.0
# Density lowered (was 0.0018, back below light_clay's own 0.0015) -- at
# 0.0018 with fog==sky (a fully saturated blue), the pale ground/building
# tokens measured as blue-grey rather than ref-2's near-neutral pale tones.
# Lower density keeps the fog==sky convergence convention (unbroken) while
# letting the pale surfaces read closer to their authored near-neutral
# albedo instead of being tinted by a highly saturated fog color.
fog: { density: 0.0012 }
# Unchanged from the shipped geometry convention -- this pass is a palette
# direction, not a ribbon-shape change.
ribbon: { lane_width_m: 3.5, margin_behavior_m: 1.3, margin_global_m: 0.3, margin_local_m: 0.8 }
# Unchanged from the shipped convention (VM-078's semi-transparent-by-default
# decision) -- not part of this palette direction either.
objects: { opacity: 0.25 }

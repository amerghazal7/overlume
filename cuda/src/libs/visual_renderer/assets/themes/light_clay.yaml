# light_clay.yaml — same key set as dark_adas.yaml, no exceptions (the "no
# per-theme code branches" AC: if a theme needs a key the other doesn't,
# the schema is wrong, not the loader).
#
# Palette is grounded around assets/visualization-reference-2.jpg (the
# light-styling ground truth): a darker lavender-gray ROAD plane under
# lighter clay surroundings and a real light-blue sky. See each field's
# own comment for its ref-2 justification.
name: light_clay
palette:
  # Road-toned gray: ref-2's "ADAMS ST" road plane reads distinctly darker
  # lavender-gray against lighter clay buildings/ground. B slightly > R/G
  # for the cool/lavender cast ref-2 shows.
  ground:      [0.58, 0.58, 0.64]
  # Believable light BLUE sky: ref-2's sky is a real, fairly saturated
  # blue, not a flat near-white/pale-blue.
  sky:         [0.55, 0.70, 0.92]
  # Must equal palette.sky exactly -- keeps the fog==sky convergence guard
  # (tests/test_theme.cpp) satisfied. If sky moves, update this too.
  fog:         [0.55, 0.70, 0.92]
  # Near-white per ref-2's lane paint; legible against the darker road plane.
  lane_paint:  [0.92, 0.92, 0.90]
  # Light theme's HERO/BEHAVIOR ribbon is BLUE per ref-2 (dark_adas's hero
  # color is green -- the two themes intentionally differ here).
  ribbon_core: [0.15, 0.45, 0.95]
  ribbon_glow: [0.15, 0.45, 0.95]
  # Muted variants, distinct from the saturated blue hero above: desaturated
  # steel-blue for GLOBAL, desaturated warm tan for LOCAL -- same blue/amber
  # pairing as dark_adas, muted to not compete with the hero ribbon.
  ribbon_global: [0.45, 0.55, 0.65]
  ribbon_local: [0.70, 0.55, 0.38]
  ego: [0.05, 0.06, 0.08]  # cross-theme swap: dark_adas's ground/clay, so the ego pops on light
  # road is darker than palette.ground above -- the static road-surface
  # base coat. lane_boundary reuses the lane_paint tone. crosswalk is
  # AUTHORED warm tan (Epic 3 close finding 2026-09-09, same reasoning as
  # dark_adas's ivory): distinct from the near-white boundary dashes and
  # from road_edge's yellow, still reads as painted road marking on the
  # light road.
  crosswalk: [0.90, 0.82, 0.60]
  road: [0.40, 0.40, 0.46]
  # Faint dot guidance: 25% lane_paint / 75% road (same mix as dark_adas) =
  # 0.25*[0.92,0.92,0.90] + 0.75*[0.40,0.40,0.46] = [0.53, 0.53, 0.57].
  # Recompute if either moves.
  lane_centerline: [0.53, 0.53, 0.57]
  lane_boundary: [0.92, 0.92, 0.90]
  # Road's outer boundary (MapKind::ROAD_EDGE), renders SOLID never dashed
  # -- deeper, more saturated yellow than lane_centerline's fade, per
  # ref-2's double-yellow road-edge striping.
  road_edge: [0.75, 0.55, 0.03]
  # Baked-environment buildings (VM-052): pale gray/lavender clay, distinctly
  # lighter than palette.road above (and than palette.ground) per ref-2's
  # separation between road plane and surrounding structures.
  building: [0.72, 0.70, 0.78]
  # Deepened so every class reads as "clay but distinct" against the
  # darker road-toned ground.
  object_tints:
    car: [0.15, 0.35, 0.80]
    truck_van: [0.30, 0.40, 0.55]
    bus: [0.85, 0.55, 0.15]
    pedestrian: [0.80, 0.20, 0.20]
    cyclist: [0.80, 0.50, 0.10]
    unknown: [0.45, 0.45, 0.45]
  # critical: ref-2's coral (the following-vehicle hazard halo/pill is a
  # soft coral-red, not a harsh pure red).
  alert:
    info: [0.15, 0.5, 0.9]
    warning: [0.95, 0.6, 0.05]
    critical: [0.90, 0.35, 0.30]
material: { roughness: 0.75, metallic: 0.0 }
# Glow killed in both themes -- the hero ribbon reads as flat paint now.
emissive: { ribbon_strength: 0.0 }
# Coupled to palette.ground: must stay darker than ground by roughly the
# same proportion, or the golden legibility guard regresses. If ground
# moves, re-pick this.
grid: { line_color: [0.40, 0.38, 0.42], fade_start_m: 15.0, fade_end_m: 40.0 }
hud: { text_color: [0.1, 0.12, 0.15], accent_color: [0.15, 0.45, 0.95], scale: 1.0 }
sun: { direction: [-0.4, -0.2, -1.0], color: [1.0, 0.98, 0.92], intensity: 25000.0 }
ibl:
  # Analytic 2-band hemisphere gradient -- sky_color/ground_color should
  # track palette.sky/palette.ground above.
  sky_color:    [0.55, 0.70, 0.90]
  ground_color: [0.48, 0.48, 0.54]
  intensity: 8750.0
fog: { density: 0.0015 }  # tuned 2026-08-20: 0.008 = fog-milk, 0.0025 hazed past ~30m, 0.0008 left a hard 48-level horizon step (test_theme.cpp guard: <30) -- 0.0015 keeps the road crisp AND the patch edge blending into sky per spec 4.3
# Same fill-look values as dark_adas.yaml (see its own comment for the
# margin rationale). Old width_m key dropped; theme.cpp still parses it as
# the soft-default seed for a YAML that predates this.
ribbon: { lane_width_m: 3.5, margin_behavior_m: 1.3, margin_global_m: 0.3, margin_local_m: 0.8 }
# TrackedObject rendering opacity (VM-078). Same convention as dark_adas.yaml.
objects: { opacity: 0.25 }

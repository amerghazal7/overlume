# dark_adas.yaml — shipped default theme. All colors are LINEAR RGB (no
# sRGB decode applied by theme.cpp) — see src/theme.hpp's header comment.
name: dark_adas
palette:
  ground:      [0.05, 0.06, 0.08]
  sky:         [0.02, 0.02, 0.05]
  fog:         [0.02, 0.02, 0.05]
  # Base tone for lane_boundary/crosswalk (both soft-default to this) --
  # boundaries dash white per ref-1, centerline gets its own color below.
  lane_paint:  [0.85, 0.85, 0.88]
  # Cold (blue-leaning) green; emissive glow killed via
  # emissive.ribbon_strength below.
  ribbon_core: [0.12, 0.55, 0.42]
  ribbon_glow: [0.12, 0.55, 0.42]
  # GLOBAL (coarse route/plan overlay) blue-ish, LOCAL (near-field path)
  # amber -- both distinct from the green BEHAVIOR/hero ribbon above.
  ribbon_global: [0.25, 0.55, 0.95]
  ribbon_local: [0.95, 0.70, 0.15]
  ego: [0.82, 0.80, 0.76]  # warm near-white clay so the ego pops on dark (was light_clay's ORIGINAL ground before its 2026-08-20 re-authoring to a road-gray; no longer an exact cross-theme swap)
  # road is darker than palette.ground above -- the static road-surface
  # base coat sits visibly below the ground it's painted on. lane_boundary
  # reuses the lane_paint tone. crosswalk is AUTHORED warm ivory (Epic 3
  # close finding 2026-09-09: it soft-defaulted to lane_paint, leaving
  # crosswalks distinguishable by hatch geometry only) -- warm vs the cool
  # white boundary dashes, far off road_edge's saturated yellow.
  crosswalk: [0.95, 0.90, 0.70]
  road: [0.03, 0.035, 0.045]
  # Faint dot guidance: 25% lane_paint / 75% road = 0.25*[0.85,0.85,0.88] +
  # 0.75*[0.03,0.035,0.045] = [0.235, 0.239, 0.254]. Recompute if either
  # moves.
  lane_centerline: [0.235, 0.239, 0.254]
  lane_boundary: [0.85, 0.85, 0.88]
  # Road's outer boundary (MapKind::ROAD_EDGE), renders SOLID never dashed
  # -- saturated yellow, distinct from lane_centerline's faint fade above.
  road_edge: [0.95, 0.75, 0.05]
  # Baked-environment buildings (VM-052): near-black-navy flat clay blocks --
  # a touch bluer/lighter than road, distinct from both road and ground.
  building: [0.06, 0.07, 0.11]
  object_tints:
    car: [0.25, 0.35, 0.9]
    truck_van: [0.30, 0.35, 0.85]
    bus: [0.85, 0.6, 0.15]
    pedestrian: [0.9, 0.2, 0.2]
    cyclist: [0.9, 0.55, 0.1]
    unknown: [0.5, 0.5, 0.5]
  alert:
    info: [0.2, 0.6, 1.0]
    warning: [1.0, 0.7, 0.1]
    critical: [1.0, 0.15, 0.1]
material: { roughness: 0.85, metallic: 0.0 }
# Hero ribbon no longer blooms; ribbon_emissive.mat still carries the
# alpha-fade path, it just stops feeding the bloom pass.
emissive: { ribbon_strength: 0.0 }
grid: { line_color: [0.12, 0.14, 0.18], fade_start_m: 15.0, fade_end_m: 40.0 }
hud: { text_color: [0.9, 0.95, 1.0], accent_color: [0.10, 1.0, 0.4], scale: 1.0 }
sun: { direction: [-0.5, -0.3, -1.0], color: [0.55, 0.6, 0.75], intensity: 480000.0 }
ibl:  # analytic 2-band hemisphere gradient — NOT raw SH coefficients
  sky_color:    [0.05, 0.06, 0.12]
  ground_color: [0.02, 0.02, 0.03]
  intensity: 256000.0
# density 0.015 clears the horizon/sky convergence guard (tests/
# test_theme.cpp) 4x over (delta 62.1); the residual ~37.3 horizon/sky gap
# (golden.cpp's [50,60) band) is expected from this theme's 40m ground
# plane, not a miscalibration. See renderer.cpp setFogOptions() for the
# color-scale fix this depends on.
fog: { density: 0.015 }
# margins: GLOBAL 0.3 (widest, bottom of z-stagger), LOCAL 0.8, BEHAVIOR 1.3
# (narrowest, on top) -- each lower ribbon peeks out as a rim around the one
# stacked above it. Old width_m key dropped; theme.cpp still parses it as
# the soft-default seed for these margins if present.
ribbon: { lane_width_m: 3.5, margin_behavior_m: 1.3, margin_global_m: 0.3, margin_local_m: 0.8 }
# TrackedObject rendering opacity (VM-078). 1.0 = today's fully-opaque clay
# look. Below 1.0, objects ride the existing per-entity clay_translucent
# staleness-swap with alpha = opacity * staleness_alpha.
objects: { opacity: 1.0 }

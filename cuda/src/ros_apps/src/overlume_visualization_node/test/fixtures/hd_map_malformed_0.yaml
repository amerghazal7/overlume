# Hand-edited fixture (Epic 2 Task 2 / VM-024, "Fixture strategy": "one
# deliberately malformed hand-edited variant is enough"). All four
# namespaces below start with "centerline_" so urban_profile.yaml's
# {prefix: centerline_, render: polyline} rule keeps every one of them --
# these markers are dropped for being MALFORMED, never for classify()
# saying kDrop, so HdMapAdapter.MalformedMarkersAreDroppedAndCounted can
# assert dropped_malformed == 3 and dropped_by_rule == 0.

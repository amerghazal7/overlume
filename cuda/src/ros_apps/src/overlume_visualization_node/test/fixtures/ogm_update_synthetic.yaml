# ogm_update_synthetic.yaml (VM-025). SYNTHETIC (fixture gap 3, see
# ogm_synthetic.yaml). Patch against the 5x2 base grid: rect (x=1, y=1,
# width=2, height=1) rewritten to [42, -1] (converts to [42, 255]); every
# other cell must stay byte-identical (PartialUpdatePatchesInPlaceWithoutResizing).
# Shifting x/width past the 5-wide grid in test code is
# OutOfBoundsUpdateRectIsRejected's own variant.
header:
  frame_id: map
  stamp: {sec: 0, nanosec: 0}
x: 1
y: 1
width: 2
height: 1
data: [42, -1]

/**:
  ros__parameters:
    out_width: 1280
    out_height: 720
    quality: 1
    # 1 = rendering_node bowl, 2 = hybrid, 3 = this node (visual). Both nodes
    # must agree at startup (spec §3.1) so exactly one publisher is active
    # on /rendering/image from the first frame.
    initial_mode: 1
    # Static hello-frame camera pose [eye xyz | target xyz]; see visualization_node.cpp.
    virtual_pose:
    - -4.0
    - 0.0
    - 3.5
    - 2.0
    - 0.0
    - -0.5
    virtual_vfov_deg: 80.0
    # Ego robot mesh (VM-012); mirrors micropilot_rendering_node's
    # robot_model_path convention. "" is not "disabled": mpviz::set_ego_model
    # always renders something (a themed clay box at ego_fallback_dims on
    # load failure); this just swaps in the real M02P mesh.
    ego_model_path: /home/ag7/Downloads/M02P.glb
    ego_fallback_dims: [4.5, 2.0, 1.8]
    ego_speed_smoothing_alpha: 0.2
    # flatten_z: the HD-map layer is a 2D plane, so real z (live TF altitude,
    # dynamic-object bbox centers) would render as floating geometry above
    # it -- every adapter zeroes z while this is true (frame_transform.hpp,
    # tf_adapter.hpp). Set false once the HD-map layer has real 3D coords.
    flatten_z: true
    # HUD compositor font (VM-030). Per-checkout absolute path, same class of
    # gap as ego_model_path above (installed-package asset resolution) --
    # VM-044 (Epic 5) closes it with a real install path; this task doesn't
    # attempt ament_index_cpp resolution itself. Missing/unloadable is
    # non-fatal (CompositeHud() WARNs once, HUD just isn't drawn that tick).
    hud_font_path: /home/ag7/Documents/TPSProjector/cuda/src/ros_apps/src/micropilot_visualization_node/assets/fonts/NotoSans-Regular.ttf
    # HUD disable knob (STANDING directive, visual-mode-epic3.md): false
    # skips CompositeHud() entirely, frame passes through untouched.
    hud_enabled: true
    # Alert-callout disable knob (VM-031, STANDING directive): false skips
    # BuildNearestCallout() entirely, frame passes through untouched. Style
    # (leader line + chip color) reuses the same theme hud.accent_color the
    # HUD's own mode chip already draws with -- no new theme token.
    callouts_enabled: true
    # Per-category layer visibility (VM-032, STANDING directive disable-knob
    # story): unlike hud_enabled/callouts_enabled above, these are read LIVE
    # every tick -- a set_layers WS command (or a plain `ros2 param set`)
    # takes effect on the very next tick, no restart. layer_point_clouds is
    # declared here but stays inert until Task 6 (VM-035) adds the
    # PointCloud category it would gate.
    layer_objects: true
    layer_paths: true
    layer_map_elements: true
    layer_grids: true
    layer_alerts: true
    layer_markers: true
    layer_point_clouds: true
    # VM-077: gates the output_trajectory_carpet category. Singular knob
    # name, matching the category's own singular topic/adapter/role.
    layer_trajectory_carpet: true
    # Task 4 (VM-093): this node's own local render-mode switch -- SEPARATE
    # from initial_mode/the global /rendering/set_mode mux above (Decision 7:
    # the mux stays untouched and authoritative). 1=BOWL, 2=HYBRID,
    # 3=FREE_LOOK (default -- a fresh node with no override behaves exactly
    # as it did before this task). Live-tunable (`ros2 param set render_mode
    # <1|2|3>`, or set_parameters()); out-of-range values are REJECTED, not
    # clamped. BOWL/HYBRID render EXACTLY the CUDA node's own mode-1/2
    # content (bowl+ego / bowl+lidar+ego only -- USER DIRECTIVE 2026-09-11,
    # mode content exclusivity) -- see mode_content_mask()/
    # compose_layer_gates() in scene_assembly.hpp.
    render_mode: 3
    # Surround Stitching (follow-up USER DIRECTIVE 2026-09-11): a mode-3
    # (FREE_LOOK) ONLY layer, off by default -- when on, Task 2's
    # camera-textured bowl renders IN THE SAME FRAME as the full autonomy
    # scene (instead of the mode-1/2-only bowl above), letting the operator
    # fairly judge the bowl against the CUDA reference with the rest of the
    # scene showing too. surround_stitching_profile picks bowl-vs-hybrid
    # CONTENT for that overlay ("bowl" = Task 2's bowl path, "hybrid" =
    # Task 5/VM-094's camera-colorized lidar content) -- "hybrid" falls back
    # to "bowl" until VM-094 lands (there is nothing hybrid-specific to
    # render yet). Parity-golden captures (Task 4 Step 1's checklist)
    # disable every layer above EXCEPT this one, so the surround renders
    # alone against the CUDA reference.
    layer_surround_stitching: false
    surround_stitching_profile: bowl
    # Which shipped profile to load (urban|offroad|sim -> <profile>_profile.yaml).
    # profile_dir: "" means this package's own installed share/config
    # (resolved via ament_index_cpp in visualization_node.cpp); set an
    # absolute path to point at a hand-edited profile instead (VM-042).
    profile: urban
    profile_dir: ""
    # VM-050 (Epic 4 Task 1): manual geo-anchor override, for GPS-denied
    # replays -- NaN (all three) means "no override, sample NavSatFix+TF
    # instead" (the spec's PRIMARY path). All-or-nothing: setting only one
    # or two of these three is a config ERROR (visualization_node.cpp logs
    # it once at startup and does not apply a partial/blended anchor).
    geo_datum_lat_deg: .nan
    geo_datum_lon_deg: .nan
    geo_datum_heading_deg: .nan
    # VM-052 (Epic 4 Task 3): baked-environment (clay buildings) disable knob
    # (STANDING directive) -- false means on_activate() never calls
    # mpviz::set_environment_source() at all, same "config for every
    # rendered element" shape as hud_enabled/callouts_enabled above.
    environment_enabled: true
    # Per-checkout absolute path to Task 2 (VM-051)'s baked chunk index dir
    # (index.yaml + chunks/*.glb) -- same class of gap as ego_model_path/
    # hud_font_path above (VM-044, Epic 5, closes real ament_index
    # resolution). "" is non-fatal: on_activate() WARNs once and never calls
    # set_environment_source() (no anchor solved / no dir given -- same
    # "missing data renders nothing" convention, spec §9).
    environment_chunks_dir: ""
    # VM-091 (unified-engine migration Task 2 Step 6): mode-1 bowl camera
    # ingest. bowl_enabled default OFF (STANDING disable-knob rule) --
    # nothing below runs (no camera subs' cv_bridge conversion cost, no
    # set_bowl_config/set_camera_frame/set_camera_motion_delta calls) until
    # this is set true. n_cameras/image_topics/info_topics/camera_extrinsics
    # and bowl_R0/k/Rmax/feather_margin/sky_color below are ported verbatim
    # from micropilot_rendering_node's own default_params.yaml (the CARLA-sim
    # config -- same six real camera topics this epic's own fixture bag,
    # stack_v2_full_sensors_2026-09-09, publishes), not reinvented.
    bowl_enabled: false
    n_cameras: 6
    image_topics:
    - /fl_camera/raw_images
    - /fm_camera/raw_images
    - /fr_camera/raw_images
    - /bl_camera/raw_images
    - /bm_camera/raw_images
    - /br_camera/raw_images
    info_topics:
    - /fl_camera/camera_info
    - /fm_camera/camera_info
    - /fr_camera/camera_info
    - /bl_camera/camera_info
    - /bm_camera/camera_info
    - /br_camera/camera_info
    # GUI-tunable; in this merged node it is the ego-motion re-alignment/
    # staleness window (Step 6's redefined frame-sync gate semantics), no
    # longer a render-withholding threshold the way the old node used it.
    max_sync_latency: 0.12
    # "" disables ego-motion compensation (identity deltas every tick) --
    # this epic's own fixture bag carries no odometry topic at all, so this
    # stays the honest default; a real robot config sets it (m2o1_params.yaml
    # uses /fixposition/odometry_enu).
    odom_topic: ""
    # Read back by the GUI bridge's config-save path (mirrors
    # micropilot_rendering_node's own config_path param, rendering_node.cpp).
    config_path: ""
    bowl_R0: 17.0
    bowl_k: 0.06
    bowl_Rmax: 40.0
    feather_margin: 480.0
    # Declared false AND node-clamped to false with a WARN (Decision 3's
    # exposure/blind-zone deferral -- see the layer_param_cb_ extension in
    # visualization_node.cpp): neither has a Filament-side implementation in
    # this epic, so a config source that carries `true` (m2o1_params.yaml
    # does, for both) must not silently re-enable a capability that isn't
    # actually there. The yaml default here is honesty, not the enforcement.
    fill_blind_zone: false
    exposure_match: false
    sky_color:
    - 0.53
    - 0.7
    - 0.92
    # Style knob alongside sky_color/feather_margin (bowl.mat's
    # exposureCompensation parameter, BowlConfig::exposure_compensation).
    # Retuned 10.0 -> 1.5 at Task 2 Step 7's golden capture against this
    # exact bag (stack_v2_full_sensors_2026-09-09): 10.0 (an untested guess)
    # blew the bowl out to near-white; 1.5 matches the CUDA node's own
    # mode-1 output brightness on the same frame.
    bowl_exposure_compensation: 1.5
    camera_extrinsics:
    - 0.9961946980917455
    - -0.06269459458646724
    - 0.06054346623323177
    - -0.08715574274765814

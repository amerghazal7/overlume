    # VM-092 (unified-engine migration Task 3): self-view masks (the
    # analytic ego-occlusion test folded into bowl_mesh.cpp's BakeBowlMesh).
    # Keeps the CUDA node's exact param name and exact
    # default -- rendering_node.cpp:85 declares self_view_masks_ default
    # false, and its comment at :80-84 is the reason it stays off here too
    # (Decision 4): correct masks require the rig origin to be exactly the
    # body center, and this epic ships fill_blind_zone forced false above,
    # so an occluded vertex would become an uncovered hole rather than a
    # filled one if this were left on.
    self_view_masks: false

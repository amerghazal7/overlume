/**:
  ros__parameters:
    out_width: 1280
    out_height: 720
    quality: 1
    # 1 = rendering_node bowl, 2 = hybrid, 3 = this node (visual). Both nodes
    # must agree on the same value at startup (spec §3.1 "race handling") so
    # exactly one publisher is active on /rendering/image from the first frame.
    initial_mode: 1
    # Static hello-frame camera pose [eye xyz | target xyz] (no scene
    # ingestion until Epic 1+ — see visualization_node.cpp).
    virtual_pose:
    - -4.0
    - 0.0
    - 3.5
    - 2.0
    - 0.0
    - -0.5
    virtual_vfov_deg: 80.0
    # Ego robot mesh (Epic 1 Task 4 / VM-012) -- mirrors
    # micropilot_rendering_node's robot_model_path convention exactly.
    # "" (the code default) disables nothing here: mpviz::set_ego_model
    # always renders *something* (a themed clay box at ego_fallback_dims on
    # load failure) -- this path just swaps in the real M02P mesh once
    # converted (scripts/obj2gltf_m02p.py in visual_renderer).
    ego_model_path: /home/ag7/Downloads/M02P.glb
    ego_fallback_dims: [4.5, 2.0, 1.8]
    ego_speed_smoothing_alpha: 0.2
    # flatten_z (user directive 2026-08-20): the HD-map layer is a 2D plane
    # today, so real z (live TF altitude, dynamic-object bbox centers) would
    # otherwise render as floating geometry above it -- every adapter zeroes
    # the z it stores while this is true (frame_transform.hpp/tf_adapter.hpp).
    # Set false once the HD-map layer grows real 3D coordinates.
    flatten_z: true
    # Epic 2 Task 1 (VM-020): which shipped profile to load
    # (urban|offroad|sim -> <profile>_profile.yaml). profile_dir: "" means
    # "this package's own installed share/config" (on_configure resolves it
    # via ament_index_cpp -- see visualization_node.cpp); set it to an
    # absolute path to point at a hand-edited profile instead (VM-042).
    profile: urban
    profile_dir: ""
